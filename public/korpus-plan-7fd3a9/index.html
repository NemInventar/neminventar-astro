<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="color-scheme" content="light dark">
<title>Korpus SH.P.K — Produktionsanlæg Ferizaj</title>

<style>
:root{
  --ink:#141a20; --ink-2:#3d4a55; --ink-3:#6a7783;
  --ground:#e7eae7; --sheet:#f8f9f7; --rule:#c9d0cd; --rule-2:#dde2df;
  --rack:#2c517e; --mark:#c85a25;
  --ok:#3f6b4a; --warn:#8a6a1c; --stop:#9c3a30;
  --ok-bg:#dfe9e0; --warn-bg:#f0e6cc; --stop-bg:#f0dcd9;
  --z-lager:#dccfb2; --z-maskin:#c2d1e2; --z-overflade:#e4c8b4;
  --z-montage:#c8d6d3; --z-service:#dfe2de; --z-mezz:#c99f2e;
  --f-disp:Bahnschrift,"DIN Alternate","DIN Condensed","Franklin Gothic Medium","Arial Narrow",sans-serif;
  --f-body:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --f-data:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,"Roboto Mono",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --ink:#dfe4e2; --ink-2:#9fada9; --ink-3:#75837f;
  --ground:#181c1d; --sheet:#212627; --rule:#39413f; --rule-2:#2c3232;
  --rack:#7ba4d4; --mark:#e0834c; --ok:#8fc09a; --warn:#d9b45e; --stop:#e08a7e;
  --ok-bg:#26362a; --warn-bg:#3b3320; --stop-bg:#3d2723;
  --z-lager:#4c452f; --z-maskin:#2c3f56; --z-overflade:#553b2c;
  --z-montage:#2e403d; --z-service:#2b3130; --z-mezz:#9c7a1e;}}
:root[data-theme="dark"]{
  --ink:#dfe4e2; --ink-2:#9fada9; --ink-3:#75837f;
  --ground:#181c1d; --sheet:#212627; --rule:#39413f; --rule-2:#2c3232;
  --rack:#7ba4d4; --mark:#e0834c; --ok:#8fc09a; --warn:#d9b45e; --stop:#e08a7e;
  --ok-bg:#26362a; --warn-bg:#3b3320; --stop-bg:#3d2723;
  --z-lager:#4c452f; --z-maskin:#2c3f56; --z-overflade:#553b2c;
  --z-montage:#2e403d; --z-service:#2b3130; --z-mezz:#9c7a1e;}
:root[data-theme="light"]{
  --ink:#141a20; --ink-2:#3d4a55; --ink-3:#6a7783;
  --ground:#e7eae7; --sheet:#f8f9f7; --rule:#c9d0cd; --rule-2:#dde2df;
  --rack:#2c517e; --mark:#c85a25; --ok:#3f6b4a; --warn:#8a6a1c; --stop:#9c3a30;
  --ok-bg:#dfe9e0; --warn-bg:#f0e6cc; --stop-bg:#f0dcd9;
  --z-lager:#dccfb2; --z-maskin:#c2d1e2; --z-overflade:#e4c8b4;
  --z-montage:#c8d6d3; --z-service:#dfe2de; --z-mezz:#c99f2e;}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
.sheet{max-width:1280px;margin:0 auto;padding:28px 20px 96px}
h2{font:600 1.05rem/1.2 var(--f-disp);letter-spacing:.09em;text-transform:uppercase;margin:0}
h3{font:600 .95rem/1.3 var(--f-disp);letter-spacing:.05em;margin:0}
p{margin:0;max-width:70ch}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.dim{color:var(--ink-2)}
.sm{font-size:.86rem;line-height:1.55}

.titleblock{border:1.5px solid var(--ink);background:var(--sheet);margin-bottom:0}
.tb-top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px;padding:16px 20px;border-bottom:1.5px solid var(--ink)}
.tb-top h1{font:600 clamp(1.5rem,3.4vw,2.05rem)/1.05 var(--f-disp);margin:0;text-wrap:balance;flex:1 1 320px}
.tb-top .eyebrow{display:block;font:600 .68rem/1 var(--f-disp);letter-spacing:.2em;text-transform:uppercase;color:var(--mark);margin-bottom:7px}
.tb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr))}
.tb-cell{padding:10px 16px;border-right:1px solid var(--rule)}
.tb-cell:last-child{border-right:none}
.tb-cell dt{font:600 .6rem/1 var(--f-disp);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.tb-cell dd{margin:0;font-family:var(--f-data);font-size:.9rem;font-variant-numeric:tabular-nums}

section{margin-top:46px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;border-bottom:1.5px solid var(--ink);padding-bottom:8px;flex-wrap:wrap}
.sec-num{font:600 .72rem/1 var(--f-disp);letter-spacing:.14em;color:var(--mark);font-variant-numeric:tabular-nums}
.sec-head p{font-size:.84rem;color:var(--ink-3);margin-left:auto;text-align:right}

.seg{display:inline-flex;border:1px solid var(--rule);background:var(--sheet);overflow:hidden;flex:0 0 auto}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink-2);cursor:pointer;
  font:600 .72rem/1 var(--f-disp);letter-spacing:.11em;text-transform:uppercase;padding:9px 15px;
  border-right:1px solid var(--rule);transition:background .15s,color .15s}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--rack);color:#fff}
.seg button:focus-visible{outline:2px solid var(--mark);outline-offset:-2px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.hint{font-size:.78rem;color:var(--ink-3)}

.tabs{display:flex;border:1.5px solid var(--ink);border-top:none;background:var(--sheet);overflow-x:auto}
.tabs button{appearance:none;background:transparent;border:0;border-right:1px solid var(--rule);
  color:var(--ink-3);cursor:pointer;padding:13px 22px;white-space:nowrap;
  font:600 .76rem/1 var(--f-disp);letter-spacing:.13em;text-transform:uppercase;
  border-bottom:3px solid transparent;transition:color .15s,border-color .15s,background .15s}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mark);background:var(--ground)}
.tabs button:hover{color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--mark);outline-offset:-3px}
.tabpanel[hidden]{display:none}

.orgwrap{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:16px;align-items:start}
@media(max-width:940px){.orgwrap{grid-template-columns:1fr}}
.planwrap{display:flex;flex-direction:column;gap:16px}
.planwrap .panel{position:static}
.planwrap .panel-bd{display:grid;grid-template-columns:minmax(150px,auto) minmax(0,2fr) minmax(0,1.4fr);gap:20px;align-items:start}
@media(max-width:860px){.planwrap .panel-bd{grid-template-columns:1fr}}
.planwrap .metrics{flex-direction:column;gap:12px}
.canvas{background:var(--sheet);border:1.5px solid var(--ink);padding:16px;overflow-x:auto}
svg.plan{display:block;width:100%;min-width:560px;height:auto}
.deco{pointer-events:none}
.zone{cursor:pointer;transition:opacity .18s}
.zone rect{stroke:var(--ink);stroke-width:.055;transition:filter .15s}
.zone rect.fill,.zone rect.tab{pointer-events:all}
.zone rect.ghost{pointer-events:none}
.zone:hover rect.fill,.zone:hover rect.tab{filter:brightness(1.07)}
.zone.sel rect.fill,.zone.sel rect.tab{stroke-width:.22;stroke:var(--mark)}
.zone:focus{outline:none}
.zone:focus-visible rect.fill,.zone:focus-visible rect.tab{stroke:var(--mark);stroke-width:.28}
text{pointer-events:none;font-family:var(--f-disp);fill:var(--ink)}
.t-code{font-size:.5px;font-weight:600;fill:var(--ink-3)}
.t-name{font-size:.72px;font-weight:600;text-anchor:middle}
.t-area{font-size:.55px;text-anchor:middle;fill:var(--ink-2);font-family:var(--f-data)}
.t-hall{font-size:1px;font-weight:600;letter-spacing:.09px}
.t-sub{font-size:.58px;fill:var(--ink-3);font-family:var(--f-body)}
.t-dim{font-size:.6px;fill:var(--ink-3);text-anchor:middle;font-family:var(--f-data)}

.panel{background:var(--sheet);border:1.5px solid var(--ink);position:sticky;top:14px}
.panel-hd{padding:12px 15px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:9px}
.panel-hd .code{font:600 .68rem/1 var(--f-disp);letter-spacing:.13em;color:#fff;background:var(--rack);padding:4px 7px}
.panel-bd{padding:14px 15px;display:flex;flex-direction:column;gap:12px}
.metrics{display:flex;gap:16px;flex-wrap:wrap;margin:0}
.metric dt{font:600 .58rem/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.metric dd{margin:0;font:600 1.15rem/1 var(--f-data);font-variant-numeric:tabular-nums}
.panel h4{font:600 .6rem/1 var(--f-disp);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin:0 0 5px}
.panel ul{margin:0;padding-left:16px;font-size:.85rem;line-height:1.55}
.panel li{margin:3px 0}
.flag{border-left:2.5px solid var(--mark);padding:7px 0 7px 11px;font-size:.83rem;line-height:1.5;color:var(--ink-2)}

.legend{display:flex;flex-wrap:wrap;gap:7px 14px;margin-top:12px;padding-top:11px;border-top:1px solid var(--rule-2)}
.lg{display:inline-flex;align-items:center;gap:6px;font:600 .66rem/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.lg i{width:14px;height:14px;border:1px solid var(--ink);display:block}

.tablewrap{overflow-x:auto;background:var(--sheet);border:1.5px solid var(--ink)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.88rem}
caption{text-align:left;padding:11px 14px;border-bottom:1px solid var(--rule);font:600 .68rem/1.4 var(--f-disp);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
th{font:600 .62rem/1.3 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:9px 14px;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:bottom}
td{padding:8px 14px;border-bottom:1px solid var(--rule-2);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:700;border-top:1.5px solid var(--ink);background:var(--ground)}
tr.sub td{border-top:1px solid var(--rule);background:var(--ground);font-weight:600}
td .code{font-family:var(--f-data);font-size:.8rem;color:var(--ink-3)}

.chip{display:inline-block;font:600 .6rem/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.chip.stop{background:var(--stop-bg);color:var(--stop);border-color:var(--stop)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:12px}
.card{background:var(--sheet);border:1px solid var(--rule);padding:14px 15px;display:flex;flex-direction:column;gap:7px}
.card .k{font:600 .6rem/1.3 var(--f-disp);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.card .v{font:600 1.5rem/1 var(--f-data);font-variant-numeric:tabular-nums}
.card .n{font-size:.8rem;line-height:1.45;color:var(--ink-2)}
.card.hi{border:1.5px solid var(--mark)}
.card.hi .v{color:var(--mark)}

.qlist{list-style:none;margin:0;padding:0;background:var(--sheet);border:1.5px solid var(--ink)}
.qlist li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;padding:12px 15px;border-bottom:1px solid var(--rule-2);align-items:start}
.qlist li:last-child{border-bottom:none}
.qlist .q-n{font:600 .78rem/1.5 var(--f-data);color:var(--mark)}
.qlist .q-t{font-size:.9rem;line-height:1.5}
.qlist .q-t span{display:block;color:var(--ink-3);font-size:.8rem;margin-top:2px}

.rev{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px 16px;background:var(--sheet);border:1.5px solid var(--ink);padding:14px 16px;font-size:.86rem}
.rev .r-id{font:600 .72rem/1.6 var(--f-disp);letter-spacing:.12em;color:var(--mark)}
.rev .r-dt{font-family:var(--f-data);font-size:.8rem;color:var(--ink-3);line-height:1.6}

.org{background:var(--sheet);border:1.5px solid var(--ink);padding:22px 18px 24px}
.tier{display:flex;flex-direction:column;align-items:center}
.tier-lbl{font:600 .6rem/1 var(--f-disp);letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.stem{width:0;border-left:2px solid var(--rule);height:22px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}
.spine{display:grid;grid-template-columns:minmax(0,1fr) 0 minmax(0,1fr);align-items:center;width:100%;position:relative}
.spine::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--rule);transform:translateX(-1px)}
.branch{position:relative;padding:14px 0;display:flex;flex-direction:column;gap:8px}
.branch.left{align-items:flex-end;padding-right:30px}
.branch.right{align-items:flex-start;padding-left:30px}
.branch::after{content:"";position:absolute;top:50%;width:30px;border-top:2px solid var(--rule)}
.branch.left::after{right:0}
.branch.right::after{left:0}
.branch .row{justify-content:inherit;width:auto}
.branch-lbl{font:600 .58rem/1.3 var(--f-disp);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.branch.left .branch-lbl{text-align:right}
@media(max-width:760px){
  .spine{grid-template-columns:1fr}.spine::before{display:none}
  .branch{align-items:center!important;padding:10px 0!important}
  .branch::after{display:none}
  .branch.left .branch-lbl{text-align:center}
  .branch .row{justify-content:center;width:100%}}
.org-note{font-size:.78rem;line-height:1.5;color:var(--ink-3);text-align:center;max-width:56ch;margin-top:8px}
.node{appearance:none;text-align:left;cursor:pointer;background:var(--ground);border:1.5px solid var(--rule);
  padding:10px 12px;min-width:152px;flex:0 1 172px;display:flex;flex-direction:column;gap:5px;
  color:var(--ink);font-family:var(--f-body);transition:border-color .15s,transform .15s,background .15s}
.node:hover{border-color:var(--rack);transform:translateY(-1px)}
.node[aria-pressed="true"]{border-color:var(--mark);border-width:2px;background:var(--sheet)}
.node:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.node.vacant{border-style:dashed}
.node .n-code{font:600 .58rem/1 var(--f-data);color:var(--ink-3)}
.node .n-title{font:600 .88rem/1.25 var(--f-disp)}
.node .n-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.node .n-who{font-size:.74rem;color:var(--ink-3)}
.node.boss{flex:0 0 auto;min-width:212px;border-color:var(--ink);border-width:2px;background:var(--sheet)}
.node.boss .n-title{font-size:1.05rem}
.node.line{flex:0 0 auto;min-width:196px;border-color:var(--rack);border-width:2px;background:var(--sheet)}
.node.line .n-title{font-size:.96rem}
.node.hand{min-width:112px;flex:0 1 124px;padding:8px 10px}
.node.hand .n-title{font-size:.78rem}
.floor{border:1.5px dashed var(--rule);padding:14px 12px 13px;width:100%;display:flex;flex-direction:column;gap:11px;align-items:center}
.floor-hd{font:600 .6rem/1.3 var(--f-disp);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);text-align:center}

.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));background:var(--sheet);border:1.5px solid var(--ink)}
.step{padding:15px 17px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:7px}
.step:last-child{border-right:none}
@media(max-width:860px){.step{border-right:none;border-bottom:1px solid var(--rule)}.step:last-child{border-bottom:none}}
.step .s-n{font:600 .68rem/1 var(--f-disp);letter-spacing:.14em;color:var(--mark)}
.step .s-t{font:600 .92rem/1.3 var(--f-disp)}
.step .s-d{font-size:.81rem;line-height:1.5;color:var(--ink-2)}
.step .s-w{font:600 .58rem/1.3 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:auto;padding-top:6px}

footer{margin-top:52px;padding-top:14px;border-top:1.5px solid var(--ink);color:var(--ink-3);font-size:.78rem;line-height:1.55;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="sheet">

<div class="titleblock">
  <div class="tb-top">
    <h1><span class="eyebrow" id="x-eyebrow"></span><span id="x-h1"></span></h1>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" id="lang-da" aria-pressed="true">Dansk</button>
      <button type="button" id="lang-en" aria-pressed="false">English</button>
    </div>
  </div>
  <dl class="tb-grid" id="tbGrid"></dl>
</div>

<div class="tabs" role="tablist">
  <button type="button" role="tab" id="tab-b-plan" aria-controls="tab-plan" aria-selected="true"></button>
  <button type="button" role="tab" id="tab-b-org" aria-controls="tab-org" aria-selected="false"></button>
</div>

<!-- ═══════ FANE 1 · INDRETNING ═══════ -->
<div class="tabpanel" id="tab-plan" role="tabpanel" aria-labelledby="tab-b-plan">

<div class="cards" id="planCards" style="margin-top:34px"></div>

<section>
  <div class="sec-head"><span class="sec-num">01</span><h2 id="x-s01"></h2><p id="x-s01p"></p></div>
  <div class="toolbar"><span class="hint" id="planNote"></span></div>
  <div class="planwrap">
    <div class="canvas">
      <svg class="plan" id="plan" viewBox="-3 -5.5 60 45" role="img" aria-label="Factory floor plan"></svg>
      <div class="legend" id="legendBox"></div>
    </div>
    <aside class="panel" aria-live="polite">
      <div class="panel-hd"><span class="code" id="pCode">—</span><h3 id="pName"></h3></div>
      <div class="panel-bd">
        <dl class="metrics">
          <div class="metric"><dt id="x-area"></dt><dd id="pArea">—</dd></div>
          <div class="metric"><dt id="x-dims"></dt><dd id="pDim">—</dd></div>
          <div class="metric"><dt id="x-truck"></dt><dd id="pTruck" style="font-size:.92rem">—</dd></div>
        </dl>
        <div><h4 id="x-contents"></h4><ul id="pItems"></ul></div>
        <div id="pFlagWrap" hidden><div class="flag" id="pFlag"></div></div>
      </div>
    </aside>
  </div>
</section>

<section>
  <div class="sec-head"><span class="sec-num">02</span><h2 id="x-s02"></h2></div>
  <div class="tablewrap"><table>
    <caption id="x-c02"></caption>
    <thead><tr><th id="x-h-code"></th><th id="x-h-zone"></th><th class="n">m²</th><th id="x-h-why"></th></tr></thead>
    <tbody id="areaBody"></tbody>
  </table></div>
</section>

<section>
  <div class="sec-head"><span class="sec-num">03</span><h2 id="x-s03"></h2><p id="x-s03p"></p></div>
  <div class="tablewrap"><table>
    <caption id="x-c03"></caption>
    <thead><tr><th id="x-h-mach"></th><th class="n" id="x-h-m1"></th><th class="n" id="x-h-m2"></th>
      <th id="x-h-zone2"></th><th id="x-h-status"></th></tr></thead>
    <tbody id="machBody"></tbody>
  </table></div>
</section>

<section>
  <div class="sec-head"><span class="sec-num">04</span><h2 id="x-s04"></h2><p id="x-s04p"></p></div>
  <div class="tablewrap"><table>
    <caption id="x-c04"></caption>
    <thead><tr><th class="n" id="x-h-phase"></th><th id="x-h-what"></th><th id="x-h-why2"></th></tr></thead>
    <tbody id="phaseBody"></tbody>
  </table></div>
</section>

<section>
  <div class="sec-head"><span class="sec-num">05</span><h2 id="x-s05"></h2><p id="x-s05p"></p></div>
  <ol class="qlist" id="qBody"></ol>
</section>
</div>

<!-- ═══════ FANE 2 · ORGANISATION ═══════ -->
<div class="tabpanel" id="tab-org" role="tabpanel" aria-labelledby="tab-b-org" hidden>

<div class="cards" id="orgCards" style="margin-top:34px"></div>

<section>
  <div class="sec-head"><span class="sec-num">06</span><h2 id="x-s06"></h2><p id="x-s06p"></p></div>
  <div class="orgwrap">
    <div class="org"><div class="tier">
      <span class="tier-lbl" id="x-t-mgmt"></span>
      <div class="row" id="orgBoss"></div>
      <div class="stem"></div>
      <div class="spine">
        <div class="branch left"><span class="branch-lbl" id="x-t-staff"></span><div class="row" id="orgStaff"></div></div>
        <div></div>

function markZone(){svg.querySelectorAll(".zone").forEach(n=>n.classList.toggle("sel",n.dataset.c===selZone));}
function pickZone(c){
  const z=Z.find(v=>v.c===c); if(!z)return; selZone=c; markZone();
  document.getElementById("pCode").textContent=z.c;
  document.getElementById("pName").textContent=t(z.n);
  document.getElementById("pArea").textContent=(z.w*z.d)+" m²";
  document.getElementById("pDim").textContent=z.w+" × "+z.d+" m";
  const pt=document.getElementById("pTruck");
  pt.textContent=z.truck?S("truckYes"):S("truckNo");
  pt.style.color=z.truck?"var(--ink)":"var(--mark)";
  const ul=document.getElementById("pItems");
  ul.innerHTML=z.items.map(i=>`<li>${t(i)}</li>`).join("")
    +`<li style="color:var(--ink-3);margin-top:7px"><em>${t(z.why)}</em></li>`;
  const fw=document.getElementById("pFlagWrap");
  if(z.flag){fw.hidden=false;document.getElementById("pFlag").textContent=t(z.flag);}else fw.hidden=true;
}

let selRole="K-00";
function nodeHTML(r){
  const vac=t(r.st)===t(["Uafklaret","Undecided"])||(r.who&&t(r.who)===t(["Ubesat","Vacant"]));
  const cls=r.tier==="boss"?"boss":r.tier==="hand"?"hand":r.tier==="line"?"line":"";
  return `<button type="button" class="node ${cls}${vac?" vacant":""}" data-c="${r.c}" aria-pressed="${r.c===selRole}">
    <span class="n-code">${r.c}${r.n>1?" ×"+r.n:""}</span>
    <span class="n-title">${t(r.t)}</span>
    <span class="n-meta"><span class="chip ${r.stc}">${t(r.st)}</span>${r.who?`<span class="n-who">${t(r.who)}</span>`:""}</span></button>`;
}
function buildOrg(){
  [["orgBoss","boss"],["orgStaff","staff"],["orgSys","sys"],["orgLine","line"],["orgHands","hand"]]
    .forEach(([id,tier])=>document.getElementById(id).innerHTML=ORG.filter(r=>r.tier===tier).map(nodeHTML).join(""));
  document.querySelectorAll(".node").forEach(n=>n.addEventListener("click",()=>pickRole(n.dataset.c)));
  pickRole(selRole);
}
function pickRole(c){
  const r=ORG.find(v=>v.c===c); if(!r)return; selRole=c;
  document.querySelectorAll(".node").forEach(n=>n.setAttribute("aria-pressed",String(n.dataset.c===c)));
  document.getElementById("oCode").textContent=r.c;
  document.getElementById("oName").textContent=t(r.t);
  document.getElementById("oCount").textContent=r.n===0?(LANG==="en"?"Hat":"Hat"):r.n;
  document.getElementById("oStatus").textContent=t(r.st);
  document.getElementById("oDuties").innerHTML=r.duties.map(d=>`<li>${t(d)}</li>`).join("");

const REV=[
 ["Rev N","02-08-2026",["Rettet efter Milots gennemgang. Massivtræ-zonen er fjernet. Kantlimning er taget HELT ud — der er ingen maskine og I arbejder ikke med det. Opskæring, CNC og boring er samlet i venstre side af hal 1, med slibning og håndarbejde lige under: bredbåndssliber, båndsliber, debur-station og håndarbejdsstationer, som i 3D-modellen. Kørezonerne er ikke længere smalle baner men to store frie felter — højre side af hal 1 og hele toppen af hal 2 — som håndtegningerne viser. I hal 2 er bejdse og lakrum flyttet ned i bunden, og kontor og personale ligger nu op ad teknikrummet.",
  "Corrected after Milot's review. The solid timber zone is removed. Edgebanding is taken out ENTIRELY — there is no machine and you do not do it. Cutting, CNC and drilling are grouped on the left of hall 1, with sanding and handwork directly below: wide-belt sander, belt sander, debur station and handwork stations, as in the 3D model. The driving zones are no longer narrow lanes but two large clear fields — the right side of hall 1 and the whole top of hall 2 — as the hand sketches show. In hall 2, staining and the lacquer room have moved to the bottom, and office and welfare now sit next to the plant room. The phase plan is cleaned up too: edgebander and solid timber machines are gone and the phases renumbered."]],
 ["Rev M","02-08-2026",["Planen er lagt om efter håndskitserne og 3D-modellen. Hallerne står nu på højkant — 22 m brede, 34 m dybe — og UDGANG er markeret samme sted på begge, på indervæggen ud mod mellemrummet. Skraveringen viser kørefri zoner. Kontor, møde og pauserum er flyttet fra mezzanin ned på gulvet, som modellen viser. Plantegningen fylder nu hele bredden, og zonebeskrivelsen står under den.",
  "The plan has been reworked from the hand sketches and the 3D model. The halls now stand portrait — 22 m wide, 34 m deep — and the EXIT is marked in the same position in both, on the inner wall facing the gap. Hatching shows no-driving zones, so the forklift only moves in raw stock, the logistics lanes and finished goods. The machine schedule is split into what is drawn in and what is missing: spray booth, edgebander, solid timber line, compressor and extraction are not in the model. Office, meeting room and break room have moved from the mezzanine down to the floor, as the model shows. The plan now uses the full width, with the zone description below it."]],
 ["Rev L","02-08-2026",["Truckansvaret er lagt ind som H-06 — en HAT på en af hænderne, ikke et ekstra hoved. Han henter råvarer ud til forbrug og læsser færdigvarer, og arbejder som almindelig hånd i bejdse/lak og montage resten af tiden. Bemandingen er stadig 13, og truckkørsel er bevidst ikke lagt oveni timeskemaet, fordi materialeflytning allerede ligger i de 20-30 % der ikke bliver til produktion.",
  "Forklift duty is added as H-06 — a HAT worn by one of the hands, not an extra head. He takes raw stock out to the point of use and loads finished goods, and works as an ordinary hand in finishing and assembly the rest of the time. Manning is still 13, and forklift work is deliberately not added on top of the hours schedule, because moving material already sits inside the 20-30 % that does not become production."]],
 ["Rev K","02-08-2026",["Produktionslederen (K-04) er nu ultimativt kvalitetsansvarlig: intet forlader fabrikken uden hans godkendelse. Han vejleder desuden medarbejderne i arbejdsmetoder og logger materialeforbrug pr. job, så forbruget kan holdes op mod de ATK-godkendte normativer ved kontrol. Ny åben post: hvem fører materialeloggen indtil han starter i september.",
  "The production manager (K-04) is now the ultimate owner of quality: nothing leaves the factory without his approval. He also coaches the team on working methods and logs material consumption per job, so consumption can be held against the ATK-approved production norms at inspection. New open item: who keeps the material log until he starts in September."]],
 ["Rev J","02-08-2026",["Den første montagemedarbejder er ansat på fuld tid. H-04 står nu som 1 af 2 besat, “på plads i dag” går fra 1 til 2, og der mangler 7 ansættelser i stedet for 8. Timeregnskabet er uændret — de to montagepladser var allerede regnet med.",
  "The first assembly worker has been hired full time. H-04 now reads 1 of 2 filled, “in place today” goes from 1 to 2, and 7 hires remain instead of 8. The hours model is unchanged — both assembly positions were already counted."]],
 ["Rev I","02-08-2026",["Siden er nu hostet på vores eget domæne, så den kan åbnes fra en telefon uden login. I den forbindelse er alt internt taget ud: navngivne kundeprojekter, leverandørnavne, interne systemnavne og Slack-id'er. Pointerne står stadig — fx hvorfor minimumsbeholdning på lak er den vigtigste enkeltopgave — bare uden at hænge en bestemt sag ud. Siden er sat til noindex og ligger på en ikke-gættelig adresse.",
  "The page is now hosted on our own domain so it can be opened from a phone without a login. In connection with that, everything internal has been taken out: named customer projects, supplier names, internal system names and Slack IDs. The points still stand — for instance why minimum stock of lacquer is the single most important task — just without naming a specific job. The page is set to noindex and sits at an unguessable address."]],
 ["Rev H","02-08-2026",["Alle priser og beløb fjernet fra siden. Den er produktionens dokument: mål, flow, roller, timer og kapacitet — ikke økonomi. Husleje, maskinpriser og anlægsudgifter hører i den danske del af sagen og står ikke her. Bemanding i antal personer bliver stående, fordi det er produktionens eget planlægningsgrundlag.",
  "All prices and monetary figures have been removed from this page. It is production's document: dimensions, flow, roles, hours and capacity — not finance. Rent, machine prices and capital costs belong to the Danish side of the business and are not shown here. Manning in numbers of people stays, because that is production's own planning basis."]],
 ["Rev G","02-08-2026",["Én-hal-scenariet fjernet — begge lokaler tages, så det er ikke længere et valg der skal vises. Nøgletallene på indretningsfanen viser nu 1.496 m² til rådighed mod 1.044 m² behov, altså 452 m² luft. Mezzaninen er nedgraderet fra nødvendighed til noget der kan tages efter maskinerne.",
  "The one-hall scenario has been removed — both units are being taken, so it is no longer a choice worth showing. The layout tab's key figures now read 1,496 m² available against 1,044 m² needed, i.e. 452 m² of slack. The mezzanine is downgraded from a necessity to something that can follow the machines."]],
 ["Rev F","02-08-2026",["Hænderne rettet efter Milots præcisering: montage og bejdse/lak er egne roller à 2, CNC og sav er to adskilte roller à 1 og ansættes først i oktober med maskinerne, og 2 pakkere der også står i montagen. Ingen CNC/montage-dobbeltroller. Én montagemedarbejder kører desuden alle emner gennem sliberen fra oktober. Fuld bemanding falder fra 14 til 13, og direkte produktionstimer fra 938 til 834 t/md.",
  "Hands corrected per Milot: assembly and stain/lacquer are their own roles with 2 each, CNC and saw are two separate roles with 1 each and are only hired in October with the machines, plus 2 packers who also work in assembly. No CNC/assembly dual roles. One assembly worker additionally runs all parts through the sander from October. Full manning drops from 14 to 13, and direct production hours from 938 to 834 h/mo."]],
 ["Rev E","02-08-2026",["Sprogskifte dansk/engelsk på hele platformen, så Argjent kan følge med. Ny sektion 10: produktionstimer — 2.086 betalte timer/md ved fuld bemanding, heraf 938 direkte produktionstimer, fordelt pr. område og pr. måned, med forudsætninger. Fund: der findes ingen timetal i tilbuds- eller produktionsdata, kun leveringstid i dage.",
  "Danish/English toggle across the whole platform so Argjent can follow along. New section 10: production hours — 2,086 paid hours/month at full manning, of which 938 are direct production hours, broken down by area and by month, with assumptions. Finding: there are no hour figures anywhere in quote or production data, only lead time in days."]],
 ["Rev D","02-08-2026",["Organisationstræet lagt om til stab og linje: produktionslederen står alene på rygraden lige over gulvet, systemansvarlig flyttet ud som egen gren til højre.",
  "Org chart reworked into staff and line: the production manager stands alone on the spine directly above the floor, systems lead moved out as its own branch to the right."]],
 ["Rev C","02-08-2026",["Ny fane: Organisation. Organisationstræ, snitfladen mod NI DK i fem trin, relationstabel og bemandingsplan.",
  "New tab: Organisation. Org chart, the five-step interface with NI Denmark, relationship table and hiring plan."]],
 ["Rev B","01-08-2026",["Rettet: zonerne kunne ikke klikkes — gitterfladen lå oven på planen og opfangede alle klik.",
  "Fixed: zones could not be clicked — the grid overlay sat on top of the plan and swallowed every click."]],
 ["Rev A","01-08-2026",["Første udkast. Pladsprogram 1.044 m² fordelt på 13 zoner, U-flow i hal 2, mezzanin 180 m² som option.",
  "First draft. Space programme of 1,044 m² across 13 zones, U-flow in hall 2, 180 m² mezzanine as an option."]]
];

 [["Til rådighed","Available"],"1.496 m²",["To haller à 748 m². Plus 180 m² mezzanin i hal 2.","Two halls of 748 m² each. Plus a 180 m² mezzanine in hall 2."],""],
 [["Gulvbehov, fuldt flow","Floor needed, full flow"],"1.044 m²",["13 zoner + 16 % gange. Personale ligger ikke i tallet — det hører på mezzanin.","13 zones + 16 % aisles. Staff facilities are not in the figure — they belong on the mezzanine."],""],
 [["Luft til vækst","Room to grow"],"+452 m²",["Plads til andet skift, flere maskiner og et større færdigvarelager.","Space for a second shift, more machines and a larger finished-goods store."],"hi"],
 [["Fri højde","Clear height"],"6,0 m",["Nok til mezzanin i 3,0 m og reoler i 4–5 niveauer. Højden er den vigtigste enkeltressource i planen.","Enough for a mezzanine at 3.0 m and racking in 4–5 levels. Height is the single most valuable resource in the plan."],""]

 [["På plads i dag","In place today"],"2",["Argjent + én montagemedarbejder på fuld tid. Resten af gulvet er lånt kapacitet indtil lokalet overtages.","Argjent plus one full-time assembly worker. The rest of the floor is borrowed capacity until the premises are taken over."],""],
 [["Skal ansættes nu","To hire now"],"7",["1 montage · 2 bejdse/lak · 2 pakning · 3D-tegner · materiale &amp; logistik.","1 assembly · 2 stain/lacquer · 2 packing · 3D draughtsman · materials &amp; logistics."],"hi"],
 [["Refererer til Argjent","Reporting to Argjent"],"5",["Sikkerhed · 3D · materiale &amp; logistik · produktionsleder · systemansvarlig.","Safety · drawing · materials &amp; logistics · production manager · systems lead."],""]

 [["Heraf direkte produktion","Of which direct production"],"834",["T/md ved 70 % udnyttelse. Loft ved 80 %: 954 t/md.","H/mo at 70 % utilisation. Ceiling at 80 %: 954 h/mo."],"hi"],
 [["Andel der bliver produktion","Share that becomes production"],"43 %",["Under halvdelen af de betalte timer. Ved 80 %: 49 %.","Less than half the paid hours. At 80 %: 49 %."],""],

/* ═══════════ RENDER ═══════════ */
const $=id=>document.getElementById(id);
const cardHTML=([k,v,n,c])=>`<div class="card ${c}"><span class="k">${t(k)}</span><span class="v">${v}</span><span class="n">${t(n)}</span></div>`;

function render(){
  ["eyebrow","h1"].forEach(k=>$("x-"+k).textContent=S(k));
  $("tab-b-plan").textContent=S("tab1"); $("tab-b-org").textContent=S("tab2");
  $("tbGrid").innerHTML=[["tbLoc","tbLocV"],["tbH","tbHV"],["tbA","tbAV"],["tbS","tbSV"],["tbR","tbRV"],["tbSt","tbStV"]]
    .map(([a,b])=>`<div class="tb-cell"><dt>${S(a)}</dt><dd>${S(b)}</dd></div>`).join("");

  ["s01","s01p","s02","s03","s03p","s04","s04p","s05","s05p","s06","s06p","s07","s07p",
   "s08","s08p","s09","s09p","s10","s10p","s11","s11p","s12","c02","c03","c04","c08","c09",
   "c10a","c10b","c10c","f1","f2","f3"].forEach(k=>{const n=$("x-"+k);if(n)n.textContent=S(k);});
  $("x-hrsintro").innerHTML=S("hrsintro");
  $("x-hrsflag").textContent=S("hrsflag");
  ["area","dims","contents","count","status","duties","talks"].forEach(k=>$("x-"+k).textContent=S(k));
  $("x-t-mgmt").textContent=S("tMgmt"); $("x-t-staff").textContent=S("tStaff");
  $("x-t-sys").textContent=S("tSys"); $("x-t-line").textContent=S("tLine");
  $("x-t-floor").textContent=S("tFloor"); $("x-orgnote").textContent=S("orgnote");
  $("planNote").textContent=S("planNote")+" "+S("planNote2");
  [["x-h-code","hCode"],["x-h-zone","hZone"],["x-h-why","hWhy"],["x-h-mach","hMach"],["x-h-m1","hM1"],
   ["x-h-m2","hM2"],["x-h-zone2","hZone"],["x-h-status","hStatus"],["x-h-phase","hPhase"],["x-h-what","hWhat"],
   ["x-h-why2","hWhy2"],["x-h-between","hBetween"],["x-h-about","hAbout"],["x-h-when","hWhen"],["x-h-out","hOut"],
   ["x-h-when2","hWhen2"],["x-h-role","hRole"],["x-h-num","hNum"],["x-h-tot","hTot"],["x-h-why3","hWhy3"],
   ["x-h-area","hArea"],["x-h-fte","hFte"],["x-h-att","hAtt"],["x-h-d70","hD70"],["x-h-d80","hD80"],
   ["x-h-zone3","hZone"],["x-h-month","hMonth"],["x-h-hands","hHands"],["x-h-ind","hInd"],["x-h-att2","hAtt"],
   ["x-h-util","hUtil"],["x-h-dir","hDir"],["x-h-driver","hDriver"],["x-h-assume","hAssume"],["x-h-val","hVal"],
   ["x-h-basis","hBasis"]].forEach(([id,k])=>{const n=$(id);if(n)n.textContent=S(k);});

  $("legendBox").innerHTML=[["lgLager","--z-lager"],["lgMask","--z-maskin"],["lgOver","--z-overflade"],
    ["lgMont","--z-montage"],["lgServ","--z-service"],["lgMezz","--z-mezz"],["lgFlow","--mark"]]
    .map(([k,v])=>`<span class="lg"><i style="background:var(${v})"></i>${S(k)}</span>`).join("")
    +`<span class="lg"><i style="background:repeating-linear-gradient(45deg,var(--ink) 0 1px,transparent 1px 4px)"></i>${S("lgNoDrive")}</span>`;

  $("planCards").innerHTML=PLANCARDS.map(cardHTML).join("");
  $("orgCards").innerHTML=ORGCARDS.map(cardHTML).join("");
  $("hourCards").innerHTML=HOURCARDS.map(cardHTML).join("");

  let s1=0,s2=0,rows="";
  ["1","2"].forEach(h=>{
    Z.filter(z=>z.c[0]===h).forEach(z=>{const a=z.w*z.d; if(h==="1"){s1+=a}else{s2+=a}
      rows+=`<tr><td><span class="code">${z.c}</span></td><td>${t(z.n)}${z.truck?"":` <span class="chip warn">${S("truckNo")}</span>`}</td><td class="n">${a}</td><td class="sm dim">${t(z.why)}</td></tr>`;});
    rows+=`<tr class="sub"><td></td><td>${LANG==="en"?"Hall":"Hal"} ${h}</td><td class="n">${h==="1"?s1:s2}</td><td></td></tr>`;
  });
  rows+=`<tr class="total"><td></td><td>${LANG==="en"?"Total floor":"Gulv i alt"}</td><td class="n">${s1+s2}</td><td class="sm">${LANG==="en"?"Against 1,044 m² needed":"Mod 1.044 m² gulvbehov"}</td></tr>`;
  $("areaBody").innerHTML=rows;

  $("machBody").innerHTML=MACH.map(([n,a,b,z,s,l])=>
    `<tr><td>${t(n)}</td><td class="n">${t(a)} m</td><td class="n">${t(b)}</td><td><span class="code">${z}</span></td><td><span class="chip ${s}">${t(l)}</span></td></tr>`).join("");
  $("phaseBody").innerHTML=PH.map(([f,w,y])=>`<tr><td class="n"><b>${f}</b></td><td>${t(w)}</td><td class="sm dim">${t(y)}</td></tr>`).join("");
  $("qBody").innerHTML=Q.map(([a,b,o],i)=>`<li><span class="q-n">${String(i+1).padStart(2,"0")}</span><span class="q-t"><b>${t(a)}</b><span>${t(b)}</span></span><span class="chip ${t(o)==="Joachim"||t(o)==="Udlejer"||t(o)==="Landlord"?"warn":"ok"}">${t(o)}</span></li>`).join("");
  $("flowBody").innerHTML=FLOW.map(([n,a,b,w])=>`<div class="step"><span class="s-n">${n}</span><span class="s-t">${t(a)}</span><span class="s-d">${t(b)}</span><span class="s-w">${w}</span></div>`).join("");
  $("relBody").innerHTML=REL.map(([a,b,c,d])=>`<tr><td><b>${t(a)}</b></td><td class="sm">${t(b)}</td><td class="sm dim">${t(c)}</td><td class="sm">${t(d)}</td></tr>`).join("");
  $("hireBody").innerHTML=HIRE.map(([w,r,n,tt,y])=>`<tr><td><b>${t(w)}</b></td><td>${t(r)}</td><td class="n">${n}</td><td class="n">${tt}</td><td class="sm dim">${t(y)}</td></tr>`).join("")
    +`<tr class="total"><td></td><td>${LANG==="en"?"Full manning incl. Argjent":"Fuld bemanding inkl. Argjent"}</td><td class="n"></td><td class="n">13</td><td class="sm">${LANG==="en"?"14 if the safety officer is hired rather than a hat":"14 hvis sikkerhedsansvarlig ansættes frem for at være en hat"}</td></tr>`;
  $("hoursBody").innerHTML=HOURS.map(([k,n,f,a,d7,d8,z])=>
    `<tr class="${k==="sub"?"sub":k==="total"?"total":""}"><td>${t(n)}</td><td class="n">${f}</td><td class="n">${a}</td><td class="n">${d7}</td><td class="n">${d8}</td><td><span class="code">${z}</span></td></tr>`).join("");
  $("rampBody").innerHTML=RAMP.map(([m,h,i,a,u,d,w])=>
    `<tr><td><b>${t(m)}</b></td><td class="n">${h}</td><td class="n">${i}</td><td class="n">${a}</td><td class="n">${u}</td><td class="n"><b>${d}</b></td><td class="sm dim">${t(w)}</td></tr>`).join("");
  $("assumeBody").innerHTML=ASSUME.map(([a,v,b])=>`<tr><td>${t(a)}</td><td class="n">${t(v)}</td><td class="sm dim">${t(b)}</td></tr>`).join("");
  $("oqBody").innerHTML=OQ.map(([a,b,o],i)=>`<li><span class="q-n">${String(i+1).padStart(2,"0")}</span><span class="q-t"><b>${t(a)}</b><span>${t(b)}</span></span><span class="chip ${t(o)==="Joachim"?"warn":"ok"}">${t(o)}</span></li>`).join("");
  $("revBody").innerHTML=REV.map(([i,d,x])=>`<span class="r-id">${i}</span><span class="r-dt">${d}</span><span>${t(x)}</span>`).join("");

  buildPlan(); pickZone(selZone); buildOrg();
}

$("lang-da").onclick=()=>{if(LANG==="da")return;LANG="da";$("lang-da").setAttribute("aria-pressed","true");$("lang-en").setAttribute("aria-pressed","false");render();};
$("lang-en").onclick=()=>{if(LANG==="en")return;LANG="en";$("lang-en").setAttribute("aria-pressed","true");$("lang-da").setAttribute("aria-pressed","false");render();};

[["tab-b-plan","tab-plan"],["tab-b-org","tab-org"]].forEach(([b,p],_,all)=>{
  $(b).addEventListener("click",()=>{
    all.forEach(([bb,pp])=>{const on=bb===b;$(bb).setAttribute("aria-selected",String(on));$(pp).hidden=!on;});
    window.scrollTo({top:0,behavior:"smooth"});
  });
});

render();
</script>

</body>
</html>
