# Branches (alt undtagen main): samme tekst-lint og build som udgivelsen + en forhåndsvisning på
# Cloudflare Pages, så en branch kan ses på telefonen, før den merges:
#   https://<branch>.neminventar-preview.pages.dev   (adressen står også i kørslens Summary)
# Forhåndsvisningen er skjult for søgemaskiner (X-Robots-Tag: noindex) og har canonical = neminventar.dk.
# main udgives af deploy.yml til GitHub Pages; denne fil rører aldrig det levende site.
name: Branch-tjek og forhåndsvisning

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint kundevendt tekst
        run: python3 scripts/lint-web-copy.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # Samme billed-cache som deploy.yml (lokale-billeder). En branch læser main's cache, men gemmer sin egen.
      - name: Cache for billeder fra Supabase
        uses: actions/cache@v4
        with:
          path: .cache/lokale-billeder
          key: lokale-billeder-${{ github.run_id }}
          restore-keys: lokale-billeder-

      - name: Build
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: https://neminventar.dk

      - name: Sagsnavne pr. side (kun ADVAR)
        run: python3 scripts/lint-web-copy.py --dist dist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Skjul forhåndsvisningen for søgemaskiner
        run: |
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' >> dist/_headers

      - name: Udgiv forhåndsvisning (Cloudflare Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Ingen Cloudflare-nøgle i repoet — springer forhåndsvisningen over."; exit 0; fi
          npx --yes wrangler@4 pages project create neminventar-preview --production-branch main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy dist --project-name neminventar-preview --branch "$GITHUB_REF_NAME" --commit-dirty=true | tee deploy.log
          ALIAS=$(grep -oE 'https://[a-z0-9-]+\.neminventar-preview\.pages\.dev' deploy.log | tail -1)
          echo "### Forhåndsvisning af \`$GITHUB_REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$ALIAS" >> "$GITHUB_STEP_SUMMARY"
