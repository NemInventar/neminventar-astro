# Branches (alt undtagen main): samme tekst-lint og build som udgivelsen, så en rød branch ses før den merges.
# INGEN forhåndsvisning på Cloudflare længere (16-11-2026): den krævede Cloudflare-nøglen på alle branches,
# og så kan enhver med skriveadgang få den udleveret fra sin egen branch — den nøgle kan udgive til alle vores
# Cloudflare-sider. Nøglen ligger nu i environment "production", som kun main når (api.yml, api-domaene.yml).
# Her bruges kun SUPABASE_URL og SUPABASE_ANON_KEY, som i forvejen står i det udgivne site.
# scripts/test_workflow_secrets.py holder reglen. Se en branch lokalt med `npm run dev`.
# main udgives af deploy.yml til GitHub Pages; denne fil rører aldrig det levende site.
name: Branch-tjek

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint kundevendt tekst
        run: python3 scripts/lint-web-copy.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # Samme billed-cache som deploy.yml (lokale-billeder). En branch læser main's cache, men gemmer sin egen.
      - name: Cache for billeder fra Supabase
        uses: actions/cache@v4
        with:
          path: .cache/lokale-billeder
          key: lokale-billeder-${{ github.run_id }}
          restore-keys: lokale-billeder-

      - name: Build
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: https://neminventar.dk

      - name: Sagsnavne pr. side (kun ADVAR)
        run: python3 scripts/lint-web-copy.py --dist dist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # api.yml udgiver kun fra main; rutningen testes her, så en branch stadig bliver rød ved fejl
      - name: Test API-proxyens rutning
        run: node --test api/test/*.test.mjs

      - name: Secrets kun i environment production
        run: python3 scripts/test_workflow_secrets.py
